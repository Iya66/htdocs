; Production Optimized User PHP Configuration
; CloudASPIRE Enterprise Configuration

[PHP]
display_errors = Off
display_startup_errors = Off
error_log = "error_log"
log_errors = On
max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 32M
session.gc_maxlifetime = 1800
; session.save_path = "/var/cpanel/php/sessions/ea-php84"
zlib.output_compression = Off
