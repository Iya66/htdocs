; Production Optimized PHP Configuration
; CloudASPIRE Enterprise Configuration

[PHP]
allow_url_fopen = On
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "error_log"
enable_dl = Off
file_uploads = On

max_execution_time = 60
max_input_time = 60
max_input_vars = 3000
memory_limit = 256M

; Optimized for media and batch uploads
post_max_size = 64M
upload_max_filesize = 32M

session.gc_maxlifetime = 1800
; session.save_path = "/var/cpanel/php/sessions/ea-php84"

zlib.output_compression = Off
